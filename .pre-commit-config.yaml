exclude: 'node_modules'
default_stages: [pre-commit]
default_install_hook_types: [pre-commit, commit-msg]
fail_fast: false

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        files: "csf_tz.*"
        exclude: ".*json$|.*txt$|.*csv|.*md|.*svg"
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-ast
      - id: check-json
      - id: check-toml
      - id: check-yaml
      - id: debug-statements

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.1
    hooks:
      - id: ruff
        name: "Run ruff import sorter"
        args: ["--select=I", "--fix"]

      - id: ruff
        name: "Run ruff linter"

      - id: ruff-format
        name: "Run ruff formatter"

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.0.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]

  - repo: local
    hooks:
      - id: frappe-semgrep
        name: semgrep (frappe rules)
        entry: bash -c 'if [ ! -d frappe-semgrep-rules/.git ]; then rm -rf frappe-semgrep-rules && GIT_TEMPLATE_DIR="" git clone --depth 1 https://github.com/frappe/semgrep-rules.git frappe-semgrep-rules; fi && semgrep scan --config ./frappe-semgrep-rules/rules --error --skip-unknown-extensions --quiet "$@"' --
        language: python
        additional_dependencies: ["semgrep"]
        types_or: [python, javascript]
        pass_filenames: true
        require_serial: true

      - id: commit-msg-length
        name: check commit message length
        entry: python3
        args:
          - -c
          - |
            import sys
            lines = open(sys.argv[1]).read().splitlines()
            if not lines: sys.exit(0)
            if len(lines[0].strip()) > 72:
                print("Error: Commit subject line too long (> 72 chars).")
                sys.exit(1)
            if len(lines) > 1 and lines[1].strip() != "":
                print("Error: Second line of commit message must be empty.")
                sys.exit(1)
        language: system
        stages: [commit-msg]

ci:
    autoupdate_schedule: weekly
    skip: []
    submodules: false
