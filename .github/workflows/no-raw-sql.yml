name: No Raw SQL

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  no-raw-sql:
    name: Reject newly introduced raw database SQL
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Locate Frappe app package
        id: app
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t hooks < <(find . -mindepth 2 -maxdepth 3 -type f -name hooks.py -not -path './.git/*' -print)
          if [ "${#hooks[@]}" -ne 1 ]; then
            echo "Expected exactly one Frappe hooks.py, found ${#hooks[@]}" >&2
            exit 1
          fi
          echo "app_dir=$(dirname "${hooks[0]}")" >> "$GITHUB_OUTPUT"

      - name: Reject newly introduced raw database SQL calls
        shell: bash
        env:
          APP_DIR: ${{ steps.app.outputs.app_dir }}
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base=$(git merge-base "$PR_BASE_SHA" HEAD)
          elif [ "$EVENT_NAME" = "push" ] && [ -n "$PUSH_BEFORE_SHA" ] && ! [[ "$PUSH_BEFORE_SHA" =~ ^0+$ ]]; then
            base="$PUSH_BEFORE_SHA"
          else
            # Compare first-push/manual runs to the hotfix base (never bypass validation).
            base=$(git merge-base origin/version-15-hotfix HEAD)
          fi

          # Existing SQL is legacy debt; check added lines, including edits to old SQL calls.
          # Ignore the +++ diff path header. Limit to Python files under this Frappe app.
          changed_sql=$(git diff --unified=0 --no-ext-diff "$base" HEAD -- "$APP_DIR" \
            | awk '/^diff --git / { python = ($0 ~ /\.py b\//) } python && /^\+[^+]/ { print substr($0, 2) }' \
            | grep -nE 'frappe\.db\.(sql|multisql)\b|(^|[^[:alnum:]_])db\.sql[[:space:]]*\(' || true)
          if [ -n "$changed_sql" ]; then
            printf '%s\n' "$changed_sql"
            echo "::error::New raw database SQL calls are not allowed. Use frappe.qb or higher-level Frappe APIs."
            exit 1
          fi
          echo "No newly introduced raw SQL calls found."
