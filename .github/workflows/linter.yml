name: Linters

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linters-${{ github.repository }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  semgrep:
    name: Frappe Linter
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Download Semgrep rules
        run: git clone --depth 1 https://github.com/frappe/semgrep-rules.git frappe-semgrep-rules

      - name: Install Semgrep
        run: pip install semgrep

      - name: Run Semgrep rules
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          mapfile -t files < <(
            git diff --name-only --diff-filter=ACMR "origin/${{ github.base_ref }}...HEAD" -- 'csf_tz/**/*.py' 'csf_tz/**/*.js'
          )
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No changed Python or JavaScript files to scan."
            exit 0
          fi

          semgrep scan --config ./frappe-semgrep-rules/rules             --config r/python.lang.security             --severity=ERROR --error "${files[@]}"

      - name: Semgrep warnings (non-blocking)
        if: github.event_name == 'pull_request' && always()
        shell: bash
        run: |
          mapfile -t files < <(
            git diff --name-only --diff-filter=ACMR "origin/${{ github.base_ref }}...HEAD" -- 'csf_tz/**/*.py' 'csf_tz/**/*.js'
          )
          if [ "${#files[@]}" -eq 0 ]; then
            exit 0
          fi

          semgrep scan --config ./frappe-semgrep-rules/rules             --config r/python.lang.security             --severity=WARNING "${files[@]}" || true

  deps-vulnerable-check:
    name: Vulnerable Dependency Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/*requirements.txt', '**/pyproject.toml', '**/setup.py') }}
          restore-keys: |
            ${{ runner.os }}-pip-
            ${{ runner.os }}-

      - name: Install and run pip-audit
        run: |
          pip install pip-audit
          pip-audit --desc on .
