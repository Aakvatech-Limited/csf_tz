<text x="1247" y="409" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#526077">Compliance records</text>
<text x="1247" y="440" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#758397">Per applicable workflow</text>

