<text x="815" y="466" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#526077">LATRA, TIRA and traffic-fine records</text>

<!-- Results -->
<rect x="1222" y="176" width="272" height="305" rx="20" fill="#FFFFFF" stroke="#E7CDD1" stroke-width="2"/>
