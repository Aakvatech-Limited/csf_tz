<svg xmlns="http://www.w3.org/2000/svg" width="1540" height="640" viewBox="0 0 1540 640" role="img" aria-labelledby="flow-title flow-desc">
<title id="flow-title">CSF TZ operational flow</title>
<desc id="flow-desc">Configure and authorize CSF TZ, use standard ERPNext or HRMS transactions, then run only applicable independent fiscal, banking, or regulatory capabilities and review their corresponding records and reports.</desc>
<rect width="1540" height="640" rx="24" fill="#F7F9FC"/>
<rect x="0" y="0" width="1540" height="12" rx="6" fill="#0D1D38"/>
<rect x="48" y="48" width="9" height="62" rx="4" fill="#BC2230"/>
<text x="78" y="67" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" letter-spacing="3" fill="#BC2230">CSF TZ</text>
<text x="78" y="108" font-family="Arial, Helvetica, sans-serif" font-size="37" font-weight="700" fill="#0D1D38">Operational Flow</text>
<text x="740" y="103" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#526077">Local capabilities extend existing ERPNext workflows only when applicable and configured.</text>
<line x1="48" y1="134" x2="1490" y2="134" stroke="#DCE3EB" stroke-width="2"/>

<!-- Configure -->
<rect x="46" y="176" width="274" height="305" rx="20" fill="#FFFFFF" stroke="#CCD9EB" stroke-width="2"/>
