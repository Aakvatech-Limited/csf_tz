<path d="M408 224h11M408 231h11" fill="none" stroke="#2776B0" stroke-width="2" stroke-linecap="round"/>
<text x="447" y="224" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="2" fill="#2776B0">02 · WORK</text>
<text x="391" y="284" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#0D1D38">ERPNext / HRMS</text>
<text x="391" y="317" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#526077">Sales and purchases</text>
<text x="391" y="350" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#526077">Payroll and advances</text>
<text x="391" y="383" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#526077">Banking and operations</text>
<text x="391" y="440" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#758397">Standard transactions remain core</text>

