<text x="815" y="357" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#526077">Stanbic and KCB payment workflows</text>

<rect x="744" y="400" width="376" height="91" rx="17" fill="#FFF7EC" stroke="#F2D9B6" stroke-width="2"/>
