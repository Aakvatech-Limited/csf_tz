<text x="70" y="284" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#0D1D38">Configuration</text>
<text x="70" y="317" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#526077">Company settings</text>
<text x="70" y="350" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#526077">Roles and permissions</text>
<text x="70" y="383" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#526077">Provider credentials</text>
<text x="70" y="440" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#758397">Set up required services first</text>

