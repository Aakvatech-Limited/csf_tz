<text x="75" y="561" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#0D1D38">Important:</text>
<text x="172" y="561" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#34445A">Only enabled and relevant integrations execute; unrelated transactions keep their standard ERPNext / HRMS flow.</text>
<text x="75" y="583" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#6B7D91">Connections to external authorities and banks depend on configuration, credentials, permissions and service availability.</text>
